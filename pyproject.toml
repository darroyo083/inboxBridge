[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxbridge"
version = "0.1.0"
description = "Self-hosted email assistant: Gmail Primary -> LLM summary (ES) -> private Telegram group; reply drafting (DE) with confirmation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "openai==1.51.2",
    "python-telegram-bot==21.8",
    "google-api-python-client==2.147.0",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "google-cloud-pubsub==2.23.1",
    "pypdf==5.0.0",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pymupdf==1.24.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "respx==0.21.1",
    "pytest-aiohttp==1.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inboxbridge = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "real_llm: bounded real LLM provider calls (env-gated, RUN_REAL_LLM=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["tests/mocks"]

[tool.coverage.run]
source = ["inboxbridge"]
