services:
  inboxbridge:
    build: .
    image: inboxbridge:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El contenedor siempre parte con SEND_EMAILS=false a menos que .env lo active
      SEND_EMAILS: ${SEND_EMAILS:-false}
    volumes:
      # Estado mínimo (SQLite + credenciales OAuth locales de esta instalación).
      # Migrar el VPS = copiar este volumen + .env
      - inboxbridge-data:/app/data
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-m", "inboxbridge.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  inboxbridge-data:
