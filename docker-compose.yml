services:
  inboxbridge:
    build: .
    image: inboxbridge:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El contenedor siempre parte con SEND_EMAILS=false a menos que .env lo active
      SEND_EMAILS: ${SEND_EMAILS:-false}
    volumes:
      # Estado persistente y escribible: SQLite + el token OAuth (data/token.json),
      # que se reescribe en cada refresco del access token. Migrar el VPS =
      # copiar este volumen + .env + credentials/.
      - inboxbridge-data:/app/data
      # Secretos estáticos (client_secret.json, service_account_pubsub.json):
      # solo lectura. El token NO va aquí (debe poder escribirse).
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-m", "inboxbridge.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  inboxbridge-data:
